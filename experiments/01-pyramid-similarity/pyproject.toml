[project]
name = "pyramid-similarity"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "affine>=3.0.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "obstore>=0.12.1",
    "pyproj>=3.8.0",
    "pytest>=9.2.0",
    "rasterio>=1.5.2",
    "requests>=2.34.2",
    "scalevar",
    "zarr>=3",
]

[tool.uv.sources]
scalevar = { git = "https://github.com/jacobdein/scale-variance", subdirectory = "python" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
